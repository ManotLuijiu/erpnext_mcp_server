[project]
name = "erpnext_mcp_server"
authors = [
    { name = "Manot Luijiu", email = "moocoding@gmail.com"}
]
description = "ERPNext management, file operations, read-only database access, and ERPNext API integration"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
keywords = ["http", "mcp", "llm", "automation", "erpnext", "openai", "gpt", "chatgpt"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "mcp>=1.9.2",
    "anthropic>=0.40.0",
    "python-dotenv",
    "openai",
    "ipykernel",
    "httpx<0.28",
    "markdownify>=0.13.1",
    "protego>=0.3.1",
    "readabilipy>=0.2.0",
    "docling>=2.36.1",
    "asyncio",
    "pandas",
    "numpy",
    "pydantic>=2.11.5",
    "anyio",
    "starlette",
    "fastapi",
    "uvicorn",
    "ag2",
    "google-genai",
    "mem0ai",
    "python-socketio",
    "loguru",
    "fastembed>=0.7.0",
    "langchain>=0.3.25","langchain-community>=0.3.24","langchain-experimental>=0.3.4","langchain-groq>=0.3.2","langchain-mcp-adapters>=0.1.4","langchain-ollama>=0.3.3","langgraph>=0.4.8","pypdfium2>=4.30.1","rich>=14.0.0","streamlit>=1.45.1"
]

[project.scripts]
mcp-server-fetch = "mcp_server_fetch:main"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# Adding by Manot L.
[tool.uv]
dev-dependencies = ["pyright>=1.1.389", "ruff>=0.7.3"]